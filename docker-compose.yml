################################################################################
# Flex Radio Services
################################################################################
# docker-compose -f docker-compose.yml up -d
# .env file required with value for HOSTNAME for traefik
# This is for running in a container with a traefik setup
################################################################################

services:
  flex-radio-services:
    image: ghcr.io/jeffu231/flexradioservices:latest
    container_name: flex-radio-api
    restart: unless-stopped
    ports:
      - "${FLEX_RADIO_HOST_IP:-0.0.0.0}:4991-4992:4991-4992/udp" # Ports for radio communication
      - "${FLEX_RADIO_HOST_IP:-0.0.0.0}:6005-6020:6005-6020/tcp" # Range of CAT ports defined in appsettings
    networks:
      - traefik-net
    volumes:
      - flex-radio-api-settings:/app/appsettings
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && read -r status <&3 && [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flex-radio-services-api.rule=Host(`$HOSTNAME`) && (PathPrefix(`/api/frs/`))"
      - "traefik.http.services.flex-radio-services-api.loadbalancer.server.port=8080"
      - "traefik.http.services.flex-radio-services-api.loadbalancer.healthcheck.path=/health/ready"
      - "traefik.http.services.flex-radio-services-api.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.flex-radio-services-api.loadbalancer.healthcheck.timeout=5s"

networks:
  traefik-net:
    external: true

volumes:
  flex-radio-api-settings:
    external: true
